<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- Om symbol - stylized elegant path -->
  <g fill="none" stroke="#D8B56D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main body curve (lower bowl) -->
    <path d="M16 38c0 7 6 12 13 12 8 0 13-6 13-13 0-6-4-10-9-10-4 0-7 3-7 7s3 6 6 6"/>
    <!-- Upper hook -->
    <path d="M42 37c0-10-4-18-12-22-6-3-12-1-15 4"/>
    <!-- Top curve with dot -->
    <path d="M36 12c3-3 8-3 10 1s0 8-4 10"/>
    <!-- Chandrabindu (crescent + dot) -->
    <path d="M40 6c2-2 5-2 6 0"/>
    <circle cx="44" cy="3" r="1.5" fill="#D8B56D" stroke="none"/>
  </g>
</svg>